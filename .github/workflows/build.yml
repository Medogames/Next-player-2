
name: Build Next Player APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip -q nextplayer-apk-build-kit-fixed.zip -d source
          cd source/nextplayer-main
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nextplayer-debug-apk
          path: source/nextplayer-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
